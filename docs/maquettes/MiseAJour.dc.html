<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ichnos — Noter où j'en suis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&amp;family=Nunito:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Nunito', system-ui, sans-serif; font-size: 16px; line-height: 1.45">

<div aria-hidden="true" style="padding: 64px 24px 0; display: flex; flex-direction: column; gap: 18px; opacity: 0.5">
<div style="font-family: 'Lora', Georgia, serif; font-style: italic; font-size: 22px">Ichnos</div>
<div style="font-family: 'Lora', Georgia, serif; font-size: 34px; line-height: 1.1">En ce moment</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

<div role="dialog" aria-modal="true" aria-labelledby="titre-maj" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{c.surface}}; border-radius: 32px 32px 0 0; padding: 12px 24px 46px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 -12px 40px {{c.shadowStrong}}">
<div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: {{c.border}}; align-self: center"></div>

<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 id="titre-maj" style="margin: 0; font-family: 'Lora', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.15">Siddhartha</h1>
<div style="font-size: 14px; color: {{c.muted}}">Mon édition · 190 pages</div>
</div>
<a href="Main.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
<label for="page" style="font-size: 15px; font-weight: 700; color: {{c.muted}}">J'en suis à la page</label>
<div style="display: flex; align-items: center; gap: 16px">
<button aria-label="Une page de moins" style="width: 56px; height: 56px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<input id="page" type="number" inputmode="numeric" value="75" min="0" max="190" style="width: 128px; height: 76px; box-sizing: border-box; border-radius: 24px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}; text-align: center; font-family: 'Lora', Georgia, serif; font-size: 40px">
<button aria-label="Une page de plus" style="width: 56px; height: 56px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<div style="font-size: 15px; color: {{c.muted}}">sur 190</div>
</div>

<a href="Main.dc.html" style="height: 56px; border-radius: 999px; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Enregistrer</a>

<div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap">
<button style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.border}}; background: transparent; color: {{c.ink}}; font-size: 15px; font-weight: 600">J'ai terminé ce livre</button>
<button style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.border}}; background: transparent; color: {{c.ink}}; font-size: 15px; font-weight: 600">Le mettre en pause</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Thème"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var c = dark
      ? { bg: '#151413', surface: '#262422', ink: '#EEEAE4', muted: '#A6A099', accent: '#8D3131', onAccent: '#F5EFE9', border: '#3A3734', scrim: 'rgba(0,0,0,0.55)', shadowStrong: 'rgba(0,0,0,0.5)' }
      : { bg: '#F5EFE6', surface: '#FBF8F3', ink: '#2A2420', muted: '#6E625A', accent: '#550000', onAccent: '#FBF8F3', border: '#DDD0C0', scrim: 'rgba(42,36,32,0.35)', shadowStrong: 'rgba(60,35,25,0.18)' };
    return { c: c };
  }
}
</script>
</body>
</html>
