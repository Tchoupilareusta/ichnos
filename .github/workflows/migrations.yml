# Vérifie les migrations de la base sur une base jetable, puis, sur main seulement,
# les applique au vrai projet Supabase (sans effet s'il n'y a rien de nouveau).
# L'Action tourne à chaque envoi, sur toutes les branches : le dernier commit d'une
# pull request porte ainsi toujours le résultat des tests de sécurité.
# Rappel : les journaux sont publics. Les tests n'utilisent que des données fictives,
# et aucune étape n'affiche de clé ni de donnée personnelle.
name: Migrations

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier sur une base jetable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Monter la base jetable et appliquer les migrations
        run: |
          set -o pipefail
          supabase db start 2>&1 | tee journal-migrations.txt

      - name: Lancer les tests de sécurité
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee journal-tests.txt

      # En cas d'échec, remonte les lignes utiles sur la page de résumé (données fictives uniquement).
      - name: Signaler ce qui a échoué
        if: failure()
        run: |
          for journal in journal-migrations.txt journal-tests.txt; do
            [ -f "$journal" ] || continue
            grep -E 'not ok|# Failed|died:|caught:|wanted:|have:|want:|Dubious|Parse errors|ERROR|error:' "$journal" | head -9 | while IFS= read -r ligne; do
              echo "::error title=Migrations::${ligne}"
            done
          done

  appliquer:
    name: Appliquer au projet Supabase
    needs: verifier
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: migrations-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier que les accès sont renseignés
        run: |
          manque=0
          for nom in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!nom}" ]; then
              echo "::error title=Réglage manquant::$nom n'est pas renseigné dans Settings → Secrets and variables → Actions."
              manque=1
            fi
          done
          exit "$manque"

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Relier le dépôt au projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Appliquer les migrations
        run: supabase db push --yes --remote
