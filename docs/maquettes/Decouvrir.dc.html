<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ichnos — Découvrir</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&amp;family=Nunito:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; box-sizing: border-box; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Nunito', system-ui, sans-serif; font-size: 16px; line-height: 1.45">

<div style="display: flex; flex-direction: column; gap: 32px; padding: 64px 24px 150px">

<h1 style="margin: 0; font-family: 'Lora', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.1">Découvrir</h1>

<section aria-labelledby="envie" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="envie" style="margin: 0; font-size: 15px; font-weight: 700; color: {{c.muted}}">Mon envie du moment</h2>
<button aria-haspopup="listbox" aria-label="Mon envie du moment : Quelque chose de réconfortant. Changer" style="min-height: 64px; padding: 12px 18px 12px 22px; border-radius: 26px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; box-shadow: 0 8px 24px {{c.shadow}}">
<span style="font-family: 'Lora', Georgia, serif; font-size: 22px; line-height: 1.2">Quelque chose de réconfortant</span>
<span style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 999px; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</span>
</button>
<p style="margin: 0; font-size: 15px; color: {{c.muted}}">Trois idées tirées de ma liste « À découvrir ».</p>
</section>

<section aria-label="Propositions" style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{ideas}}" as="b" hint-placeholder-count="3">
<article style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 26px; padding: 16px; display: flex; gap: 16px; box-shadow: 0 8px 24px {{c.shadow}}">
<div aria-hidden="true" style="{{b.coverStyle}}">
<div style="font-family: 'Lora', Georgia, serif; font-size: 13px; line-height: 1.12; font-weight: 500; hyphens: auto">{{b.title}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto">
<h3 style="margin: 0; font-family: 'Lora', Georgia, serif; font-weight: 400; font-size: 19px; line-height: 1.2">{{b.title}}</h3>
<div style="font-size: 14px; color: {{c.muted}}">{{b.author}}</div>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45">{{b.reason}}</p>
<div style="display: flex; gap: 8px; margin-top: 10px">
<a href="Fiche.dc.html" aria-label="{{b.seeLabel}}" style="height: 44px; padding: 0 18px; border-radius: 999px; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 15px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center">Voir</a>
<button aria-label="{{b.laterLabel}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: transparent; color: {{c.ink}}; font-size: 15px; font-weight: 600">Pas maintenant</button>
</div>
</div>
</article>
</sc-for>
<p style="margin: 2px 4px 0; font-size: 14px; color: {{c.muted}}">« Pas maintenant » met l'idée de côté quelques semaines. Rien d'autre ne change.</p>
</section>

<button style="height: 52px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>
D'autres idées</button>

</div>

<nav aria-label="Navigation principale" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 72px; border-radius: 999px; background: {{c.surface}}; border: 1px solid {{c.border}}; box-shadow: 0 12px 34px {{c.shadowStrong}}; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px; height: 54px; justify-content: center; text-decoration: none; color: {{c.muted}}; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5H9v5H5.5A1.5 1.5 0 0 1 4 19z"></path></svg>
Accueil</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px; height: 54px; justify-content: center; text-decoration: none; color: {{c.muted}}; font-size: 12px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h3.5v15H5zM10.5 4.5H14v15h-3.5zM16 5.6l3.2-.9 3 14.2-3.2.8z"></path></svg>
Bibliothèque</a>
<a href="Decouvrir.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px; height: 54px; border-radius: 999px; justify-content: center; text-decoration: none; background: {{c.accentSoft}}; color: {{c.accentText}}; font-size: 12px; font-weight: 700">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>
Découvrir</a>
<button aria-label="Ajouter une œuvre" style="width: 54px; height: 54px; border-radius: 999px; border: none; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Thème"},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var c = dark
      ? { bg: '#151413', surface: '#262422', ink: '#EEEAE4', muted: '#A6A099', accent: '#8D3131', accentText: '#EEEAE4', accentSoft: '#3A1E1D', onAccent: '#F5EFE9', border: '#3A3734', shadow: 'rgba(0,0,0,0.35)', shadowStrong: 'rgba(0,0,0,0.5)' }
      : { bg: '#F5EFE6', surface: '#FBF8F3', ink: '#2A2420', muted: '#6E625A', accent: '#550000', accentText: '#550000', accentSoft: '#EEDDD8', onAccent: '#FBF8F3', border: '#DDD0C0', shadow: 'rgba(60,35,25,0.08)', shadowStrong: 'rgba(60,35,25,0.14)' };
    function cover(bg, fg) {
      return 'width: 80px; height: 118px; flex: 0 0 80px; box-sizing: border-box; border-radius: 12px; background: ' + bg + '; color: ' + fg + '; padding: 9px; display: flex; flex-direction: column; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 6px 16px ' + c.shadowStrong;
    }
    var ideas = [
      { title: 'Momo', author: 'Michael Ende', reason: 'Lumineux, après la gravité de Crime et Châtiment. Le temps, l’amitié, l’attention aux autres.', bg: '#A8B59A', fg: '#2A2420' },
      { title: 'L’Homme qui plantait des arbres', author: 'Jean Giono', reason: 'Très court, une soirée suffit. Une histoire de bonté et de patience.', bg: '#3F5A45', fg: '#F1EADF' },
      { title: 'Un psaume pour les recyclés sauvages', author: 'Becky Chambers', reason: 'Science-fiction douce et apaisée, sur le sens qu’on donne à sa vie.', bg: '#8FB1AE', fg: '#2A2420' }
    ].map(function (b) {
      return Object.assign({}, b, { coverStyle: cover(b.bg, b.fg), seeLabel: 'Voir la fiche de ' + b.title, laterLabel: 'Pas maintenant pour ' + b.title });
    });
    return { c: c, ideas: ideas };
  }
}
</script>
</body>
</html>
